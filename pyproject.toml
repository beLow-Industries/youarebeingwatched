[project]
name = "youarebeingwatched"
version = "0.1.0"
description = "Prototype software for a webcam/YOLO art installation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "numpy>=1.26",
    "opencv-python>=4.9,<5",
    "ultralytics>=8.3",
]

[project.scripts]
ybwatch = "youarebeingwatched.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
